<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSLIM Telegram Sender</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            background: #111;
            border: 1px solid #222;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #181818;
            color: white;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background: #00a86b;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>MSLIM</h1>

    <input
        id="token"
        type="text"
        placeholder="Bot Token"
    >

    <input
        id="chatId"
        type="text"
        placeholder="Chat ID"
    >

    <textarea
        id="message"
        placeholder="اكتب رسالتك هنا..."
    ></textarea>

    <button onclick="sendTelegram()">
        إرسال إلى Telegram
    </button>

    <div id="status"></div>

</div>

<script>

async function sendTelegram() {

    const token = document.getElementById("token").value.trim();
    const chatId = document.getElementById("chatId").value.trim();
    const message = document.getElementById("message").value.trim();

    const status = document.getElementById("status");

    if (!token || !chatId || !message) {
        status.textContent = "❌ املأ جميع الحقول";
        return;
    }

    status.textContent = "⏳ جاري الإرسال...";

    const url =
        `https://api.telegram.org/bot${token}/sendMessage`;

    try {

        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: message
            })
        });

        const data = await response.json();

        if (data.ok) {
            status.textContent = "✅ تم إرسال الرسالة بنجاح";
            document.getElementById("message").value = "";
        } else {
            status.textContent =
                "❌ فشل الإرسال: " + data.description;
        }

    } catch (error) {

        status.textContent =
            "❌ حدث خطأ في الاتصال";

        console.error(error);
    }
}

</script>

</body>
</html>
