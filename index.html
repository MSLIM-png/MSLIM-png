<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSLIM</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, #10251c 0%, #050807 35%, #020303 75%);
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: #00ff88;
    opacity: 0.08;
    filter: blur(120px);
    animation: pulse 4s infinite alternate;
}

.container {
    position: relative;
    text-align: center;
    z-index: 2;
}

.logo {
    font-size: clamp(70px, 18vw, 180px);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: transparent;
    background: linear-gradient(
        120deg,
        #ffffff,
        #9affc9,
        #00ff88,
        #ffffff
    );
    background-size: 300%;
    -webkit-background-clip: text;
    background-clip: text;

    text-shadow:
        0 0 10px rgba(0,255,136,.4),
        0 0 30px rgba(0,255,136,.25),
        0 0 70px rgba(0,255,136,.15);

    animation: shine 5s linear infinite;
}

.line {
    width: 120px;
    height: 2px;
    margin: 20px auto;

    background: linear-gradient(
        90deg,
        transparent,
        #00ff88,
        transparent
    );

    box-shadow: 0 0 15px #00ff88;
}

.subtitle {
    color: #8fa99c;
    font-size: 13px;
    letter-spacing: 7px;
    text-transform: uppercase;
}

.corner {
    position: absolute;
    width: 25px;
    height: 25px;
    border-color: #00ff88;
    opacity: .5;
}

.c1 {
    top: -25px;
    left: -35px;
    border-top: 1px solid;
    border-left: 1px solid;
}

.c2 {
    top: -25px;
    right: -35px;
    border-top: 1px solid;
    border-right: 1px solid;
}

.c3 {
    bottom: -25px;
    left: -35px;
    border-bottom: 1px solid;
    border-left: 1px solid;
}

.c4 {
    bottom: -25px;
    right: -35px;
    border-bottom: 1px solid;
    border-right: 1px solid;
}

@keyframes shine {
    0% {
        background-position: 0%;
    }

    100% {
        background-position: 300%;
    }
}

@keyframes pulse {
    from {
        transform: scale(.8);
        opacity: .05;
    }

    to {
        transform: scale(1.2);
        opacity: .12;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>

    <div class="logo">
        MSLIM
    </div>

    <div class="line"></div>

    <div class="subtitle">
        Code • Create • Evolve
    </div>

</div>

</body>
</html>
