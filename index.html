<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>MSLIM Chat</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at top right,
            #10253d 0,
            #080b12 42%,
            #05070b 100%
        );

    color:#fff;

    font-family:
        Arial,

}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.app{
    width:100%;
    max-width:760px;
    min-height:100vh;
    margin:auto;
    position:relative;

    background:

.owner-result{

.send-input{

.send-btn{

<script>

/* ========================================================
   Config
======================================================== */

const GITHUB_OWNER = "MSLIM-png";
const GITHUB_REPO = "MSLIM-png";
const GITHUB_BRANCH = "main";

const API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;

/*
   ملاحظة أمنية:
   لتفعيل المزامنة الحقيقية بين الأجهزة،
   ضع هنا GitHub Token بصلاحية repo.
   بدون Token، سيستعمل الموقع localStorage فقط.
*/

const GITHUB_TOKEN = "";

const API_HEADERS = GITHUB_TOKEN
    ? {
        "Authorization": "Bearer " + GITHUB_TOKEN,
        "Accept": "application/vnd.github+json"
    }
    : {
        "Accept": "application/vnd.github+json"
    };


/* ========================================================
   Keys
======================================================== */

const USERS_KEY = "mslim_users";
const MESSAGES_KEY = "mslim_messages";
const CURRENT_KEY = "mslim_current_user";
const SESSION_KEY = "mslim_session";


let users = [];
let messages = [];
let currentUserData = null;
let authMode = "register";


/* ========================================================
   Storage helpers
======================================================== */

function loadLocal(){

    users = JSON.parse(
        localStorage.getItem(USERS_KEY) || "[]"
    );

    messages = JSON.parse(
        localStorage.getItem(MESSAGES_KEY) || "[]"
    );

}


function saveLocalUsers(){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}


function saveLocalMessages(){

    localStorage.setItem(
        MESSAGES_KEY,
        JSON.stringify(messages)
    );

}


/* ========================================================
   GitHub read / write
======================================================== */

async function githubRead(filename){

    if(!GITHUB_TOKEN){
        return null;
    }

    try{

        const res = await fetch(
            `${API}/${filename}?ref=${GITHUB_BRANCH}`,
            { headers: API_HEADERS }
        );

        if(!res.ok){
            return null;
        }

        const data = await res.json();

        const decoded =
            atob(
                data.content.replace(/\n/g,"")
            );

        const text =
            decodeURIComponent(
                escape(decoded)
            );

        return {
            sha: data.sha,
            data: JSON.parse(text || "[]")
        };

    }catch(e){
        console.warn("GitHub read error", e);
        return null;
    }

}


async function githubWrite(filename, jsonData, sha){

    if(!GITHUB_TOKEN){
        return false;
    }

    try{

        const text = JSON.stringify(jsonData, null, 2);

        const encoded =
            btoa(
                unescape(
                    encodeURIComponent(text)
                )
            );

        const body = {
            message: `Update ${filename}`,
            content: encoded,
            branch: GITHUB_BRANCH
        };

        if(sha){
            body.sha = sha;
        }

        const res = await fetch(
            `${API}/${filename}`,
            {
                method: "PUT",
                headers: {
                    ...API_HEADERS,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            }
        );

        if(!res.ok){
            console.warn("GitHub write failed", await res.text());
            return false;
        }

        return true;

    }catch(e){
        console.warn("GitHub write error", e);
        return false;
    }

}


let usersSha = null;
let messagesSha = null;


async function syncUsers(){

    const remote = await githubRead("users.json");

    if(remote){

        usersSha = remote.sha;

        // دمج: أخذ الاتحاد بدون تكرار
        const map = new Map();

        [...users, ...remote.data].forEach(u => {
            if(u && u.name){
                map.set(
                    u.name.toLowerCase(),
                    u
                );
            }
        });

        users = Array.from(map.values());

        saveLocalUsers();

    }

}


async function syncMessages(){

    const remote = await githubRead("messages.json");

    if(remote){

        messagesSha = remote.sha;

        const map = new Map();

        [...messages, ...remote.data].forEach(m => {

            if(!m) return;

            const key =
                (m.id||"") + "|" +
                (m.time||"") + "|" +
                (m.text||"");

            map.set(key, m);

        });

        messages = Array.from(map.values());

        saveLocalMessages();

    }

}


async function pushUsers(){

    saveLocalUsers();

    if(GITHUB_TOKEN){

        const ok = await githubWrite(
            "users.json",
            users,
            usersSha
        );

        if(ok){
            const r = await githubRead("users.json");
            if(r) usersSha = r.sha;
        }

    }

}


async function pushMessages(){

    saveLocalMessages();

    if(GITHUB_TOKEN){

        const ok = await githubWrite(
            "messages.json",
            messages,
            messagesSha
        );

        if(ok){
            const r = await githubRead("messages.json");
            if(r) messagesSha = r.sha;
        }

    }

}


/* ========================================================
   SHA-256
======================================================== */

async function sha256(text){

    const data =
        new TextEncoder().encode(text);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array
        .from(new Uint8Array(hash))
        .map(
            b =>
                b.toString(16)
                .padStart(2,"0")
        )
        .join("");

}


/* ========================================================
   Tabs
======================================================== */

function switchTab(mode){

    authMode = mode;

    document
        .getElementById("tabLogin")
        .classList.toggle("active", mode === "login");

    document
        .getElementById("tabRegister")
        .classList.toggle("active", mode === "register");

    document
        .getElementById("formTitle")
        .textContent =
            mode === "login"
            ? "تسجيل الدخول"
            : "مرحباً بك";

    document
        .getElementById("formDesc")
        .textContent =
            mode === "login"
            ? "أدخل بياناتك للدخول"
            : "أنشئ حسابك للدخول إلى الكروب";

    document
        .getElementById("ageField")
        .classList.toggle("hidden", mode === "login");

    document
        .getElementById("genderField")
        .classList.toggle("hidden", mode === "login");

    document
        .getElementById("mainBtn")
        .textContent =
            mode === "login"
            ? "دخول"
            : "إنشاء الحساب";

    document
        .getElementById("error")
        .textContent = "";

}


/* ========================================================
   Register
======================================================== */

async function register(){

    const input =
        document.getElementById("username");

    const ageInput =
        document.getElementById("age");

    const genderInput =
        document.getElementById("gender");

    const passInput =
        document.getElementById("password");

    const error =
        document.getElementById("error");


    error.textContent = "";


    const username = input.value.trim();
    const age = ageInput.value;
    const gender = genderInput.value;
    const password = passInput.value;


    if(!username || !age || !gender || !password){

        error.textContent =
            "❌ أكمل جميع البيانات.";

        return;

    }


    if(username.length < 2 || username.length > 20){

        error.textContent =
            "❌ اليوزر يجب أن يكون بين 2 و20 حرف.";

        return;

    }


    if(password.length < 4){

        error.textContent =
            "❌ كلمة المرور 4 أحرف على الأقل.";

        return;

    }


    const normalized = username.toLowerCase();


    // منع تكرار اليوزر
    const exists =
        users.some(
            u =>
                u.name &&
                u.name.toLowerCase() === normalized
        );


    if(exists){

        error.textContent =
            "❌ هذا اليوزر مستخدم بالفعل.";

        return;

    }


    const id = await sha256(normalized);
    const passHash = await sha256(password);


    // المالك
    if(normalized === "mslim"){

        const ownerExists =
            users.some(
                u =>
                    u.name &&
                    u.name.toLowerCase() === "mslim"
            );

        if(ownerExists){

            error.textContent =
                "❌ هذا اليوزر محجوز للمالك.";

            return;

        }

        const admin = {
            id,
            name: "MSLIM",
            age: Number(age),
            gender,
            pass: passHash,
            role: "owner"
        };

        users.push(admin);

        await pushUsers();

        currentUserData = admin;

        localStorage.setItem(
            SESSION_KEY,
            JSON.stringify({
                name: admin.name,
                id: admin.id
            })
        );

        openChat();

        return;

    }


    const user = {
        id,
        name: username,
        age: Number(age),
        gender,
        pass: passHash,
        role: "user"
    };

    users.push(user);

    await pushUsers();

    currentUserData = user;

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            name: user.name,
            id: user.id
        })
    );

    openChat();

}


/* ========================================================
   Login
======================================================== */

async function login(){

    const input =
        document.getElementById("username");

    const passInput =
        document.getElementById("password");

    const error =
        document.getElementById("error");


    error.textContent = "";


    const username = input.value.trim();
    const password = passInput.value;


    if(!username || !password){

        error.textContent =
            "❌ أدخل اليوزر وكلمة المرور.";

        return;

    }


    const normalized = username.toLowerCase();


    const user =
        users.find(
            u =>
                u.name &&
                u.name.toLowerCase() === normalized
        );


    if(!user){

        error.textContent =
            "❌ الحساب غير موجود.";

        return;

    }


    const passHash = await sha256(password);


    if(user.pass && user.pass !== passHash){

        error.textContent =
            "❌ كلمة المرور خاطئة.";

        return;

    }


    currentUserData = user;

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            name: user.name,
            id: user.id
        })
    );

    openChat();

}


/* ========================================================
   Submit
======================================================== */

function submitForm(){

    if(authMode === "login"){
        login();
    }else{
        register();
    }

}


/* ========================================================
   Logout
======================================================== */

function logout(){

    currentUserData = null;

    localStorage.removeItem(SESSION_KEY);

    document
        .getElementById("chatBox")
        .classList.add("hidden");

    document
        .getElementById("sendArea")
        .classList.add("hidden");

    document
        .getElementById("registerBox")
        .classList.remove("hidden");

    document.getElementById("password").value = "";

    switchTab("login");

}


/* ========================================================
   Open Chat
======================================================== */

async function openChat(){

    document
        .getElementById("registerBox")
        .classList.add("hidden");

    document
        .getElementById("chatBox")
        .classList.remove("hidden");

    document
        .getElementById("sendArea")
        .classList.remove("hidden");


    document
        .getElementById("currentUser")
        .textContent = currentUserData.name;


    const badge =
        document.getElementById("roleBadge");

    const idElement =
        document.getElementById("currentUserId");


    if(currentUserData.role === "owner"){

        badge.textContent = "👑 مالك";
        badge.className = "role role-owner";

        document
            .getElementById("ownerPanel")
            .classList.remove("hidden");

    }else{

        badge.textContent = "عضو";
        badge.className = "role role-user";

        document
            .getElementById("ownerPanel")
            .classList.add("hidden");

    }


    idElement.textContent =
        "ID: " + currentUserData.id;


    await syncMessages();

    displayMessages();


    // مزامنة دورية
    setInterval(
        async () => {

            await syncMessages();

            displayMessages();

        },
        10000
    );

}


/* ========================================================
   Display Messages
======================================================== */

function displayMessages(){

    const box =
        document.getElementById("messages");

    box.innerHTML = "";


    if(!messages.length){

        box.innerHTML =
            '<div class="empty">' +
            'لا توجد رسائل بعد.<br>' +
            'كن أول من يكتب 👋' +
            '</div>';

        return;

    }


    // ترتيب حسب الوقت
    const sorted =
        [...messages].sort(
            (a,b) => (a.ts||0) - (b.ts||0)
        );


    sorted.forEach(message => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message" +
            (
                message.role === "owner"
                ? " owner-message"
                : ""
            );


        const meta =
            document.createElement("div");

        meta.className = "message-meta";


        const sender =
            document.createElement("span");

        sender.className =
            "sender" +
            (
                message.role === "owner"
                ? " owner"
                : ""
            );

        sender.textContent = message.name;


        const badge =
            document.createElement("span");

        badge.className =
            message.role === "owner"
            ? "badge badge-owner"
            : "badge badge-user";

        badge.textContent =
            message.role === "owner"
            ? "👑 مالك"
            : "عضو";


        const id =
            document.createElement("span");

        id.className = "sender-id";

        id.textContent = "ID: " + message.id;


        meta.appendChild(sender);
        meta.appendChild(badge);
        meta.appendChild(id);


        const bubble =
            document.createElement("div");

        bubble.className = "bubble";
        bubble.textContent = message.text;


        const time =
            document.createElement("div");

        time.className = "message-time";
        time.textContent = message.time;


        wrapper.appendChild(meta);
        wrapper.appendChild(bubble);
        wrapper.appendChild(time);


        box.appendChild(wrapper);

    });


    box.scrollTop = box.scrollHeight;

}


/* ========================================================
   Send Message
======================================================== */

async function sendMessage(){

    if(!currentUserData){
        return;
    }


    const input =
        document.getElementById("messageInput");

    const text = input.value.trim();


    if(!text){
        return;
    }


    const now = new Date();


    const message = {
        id: currentUserData.id,
        name: currentUserData.name,
        role: currentUserData.role,
        text: text,
        time: now.toLocaleTimeString(
            "ar-IQ",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ),
        ts: now.getTime()
    };


    messages.push(message);

    displayMessages();

    input.value = "";


    await pushMessages();

}


/* ========================================================
   Kick User (Owner)
======================================================== */

async function kickUser(){

    if(
        !currentUserData ||
        currentUserData.role !== "owner"
    ){
        return;
    }


    const input =
        document.getElementById("kickTarget");

    const result =
        document.getElementById("ownerResult");


    const target = input.value.trim();

    result.textContent = "";


    if(!target){

        result.textContent =
            "❌ أدخل الاسم أو ID.";

        return;

    }


    const targetLower = target.toLowerCase();


    const index =
        users.findIndex(
            user =>
                (
                    user.name &&
                    user.name.toLowerCase() === targetLower
                )
                ||
                user.id === target
        );


    if(index === -1){

        result.textContent =
            "❌ العضو غير موجود.";

        return;

    }


    const targetUser = users[index];


    if(targetUser.role === "owner"){

        result.textContent =
            "❌ لا يمكن طرد المالك.";

        return;

    }


    users.splice(index, 1);

    await pushUsers();


    // حذف رسائل العضو
    messages =
        messages.filter(
            message =>
                message.id !== targetUser.id
        );


    await pushMessages();


    result.textContent =
        "✅ تم طرد " + targetUser.name;


    input.value = "";

    displayMessages();

}


/* ========================================================
   Start
======================================================== */

async function start(){

    loadLocal();

    // مزامنة أولية
    await syncUsers();
    await syncMessages();


    // استرجاع الجلسة
    const session =
        localStorage.getItem(SESSION_KEY);


    if(session){

        try{

            const parsed = JSON.parse(session);

            const user =
                users.find(
                    u =>
                        u.id === parsed.id &&
                        u.name === parsed.name
                );

            if(user){

                currentUserData = user;

                await openChat();

                return;

            }

        }catch(e){}

    }


    // لو المالك موجود مسبقاً، نروح لتسجيل الدخول
    const ownerExists =
        users.some(u => u.role === "owner");

    if(ownerExists){
        switchTab("login");
    }

}


start();

</script>
